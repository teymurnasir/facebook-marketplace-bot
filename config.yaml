# Canadian Facebook Marketplace car alerts — high-coverage settings

# Max odometer (km). Known mileage above this is skipped.
# Unknown mileage is KEPT so we don't miss cars that omit km on the card.
max_mileage_km: 250000

# Marketplace city hubs we OPEN for search (your exact regions).
locations:
  - toronto
  - richmond-hill
  - brampton
  - north-york
  - vaughan
  - markham
  - east-york
  - mississauga
  - scarborough
  - hamilton

# ONLY keep listings whose city text matches these (same 10 regions).
# Empty location on a card is still kept (Facebook sometimes omits the city).
location_keywords:
  - Toronto
  - Richmond Hill
  - Brampton
  - North York
  - Vaughan
  - Markham
  - East York
  - Mississauga
  - Scarborough
  - Hamilton

searches:
  - name: Mazda 3
    # Multiple FB queries so odd titles still surface
    queries:
      - "mazda 3"
      - "mazda3"
      - "mazdaspeed3"
    query: "mazda 3"
    min_year: 2010
    max_year: 2014
    min_price: 300
    max_price: 2300
    must_include_any:
      - mazda 3
      - mazda3
      - mazdaspeed
      - speed3
    body_styles:
      - sedan
      - hatchback
      - hatch
    require_body_style: false
    require_mileage: false

  - name: Kia Optima Hybrid
    queries:
      - "kia optima hybrid"
      - "optima hybrid"
      - "kia optima"
      - "optima hev"
    query: "kia optima hybrid"
    min_year: 2011
    max_year: 2017
    min_price: 1000
    max_price: 3000
    must_include_any:
      - optima
      - k5
    # Prefer hybrid in title, but do NOT require it — many real hybrid ads
    # only say "Kia Optima" while Facebook search already used "hybrid".
    powertrain_any: []
    body_styles:
      - sedan
    require_body_style: false
    require_mileage: false

scraper:
  sort_by: creation_time_descend
  # Deeper scroll = more cards per search (slower, fewer misses)
  max_scrolls: 6
  delay_between_searches_sec: 2
  timeout_ms: 60000
  # Vehicles for car filters; also run generic /search on core hubs
  url_modes:
    - vehicles
    - search
  # Generic Marketplace /search only on these hubs (avoids doubling every city)
  search_mode_locations:
    - toronto
    - hamilton
