# Canadian Facebook Marketplace car alerts — high-coverage settings

# Max odometer (km). Known mileage above this is skipped.
# Unknown mileage is KEPT so we don't miss cars that omit km on the card.
max_mileage_km: 250000

# Marketplace city hubs to open (wider GTA coverage).
# Nearby cities still match via location_keywords even if not listed here.
locations:
  - toronto
  - mississauga
  - brampton
  - markham
  - vaughan
  - hamilton

# ONLY keep listings from these cities (substring match on city text).
# Empty location on a card is still kept (Facebook sometimes omits the city).
location_keywords:
  - Toronto
  - Richmond Hill
  - Brampton
  - North York
  - Vaughan
  - Markham
  - East York
  - Mississauga
  - Scarborough
  - Hamilton

searches:
  - name: Mazda 3
    # Multiple FB queries so odd titles still surface
    queries:
      - "mazda 3"
      - "mazda3"
      - "mazdaspeed3"
    query: "mazda 3"
    min_year: 2010
    max_year: 2014
    min_price: 300
    max_price: 2300
    must_include_any:
      - mazda 3
      - mazda3
      - mazdaspeed
      - speed3
    body_styles:
      - sedan
      - hatchback
      - hatch
    require_body_style: false
    require_mileage: false

  - name: Kia Optima Hybrid
    queries:
      - "kia optima hybrid"
      - "optima hybrid"
      - "kia optima"
      - "optima hev"
    query: "kia optima hybrid"
    min_year: 2011
    max_year: 2017
    min_price: 1000
    max_price: 3000
    must_include_any:
      - optima
      - k5
    # At least one hybrid-related token (title/card text)
    powertrain_any:
      - hybrid
      - hev
      - phev
      - plug-in
      - plugin
      - plug in
    body_styles:
      - sedan
    require_body_style: false
    require_mileage: false

scraper:
  sort_by: creation_time_descend
  # Deeper scroll = more cards per search (slower, fewer misses)
  max_scrolls: 6
  delay_between_searches_sec: 2
  timeout_ms: 60000
  # Vehicles for car filters; also run generic /search on core hubs
  url_modes:
    - vehicles
    - search
  # Generic Marketplace /search only on these hubs (avoids doubling every city)
  search_mode_locations:
    - toronto
    - hamilton
