name = "marketplace-telegram-webhook"
main = "worker.js"
compatibility_date = "2024-11-01"

# Backup hourly-ish tick (Free CF cron is coarse). Primary tick = GitHub auto-tick.yml → /tick
[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "SETTINGS"
id = "5c38578fe2534736ae844cfb6bfc2453"

# Secrets:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_IDS
#   GITHUB_TOKEN
#   GITHUB_REPO
#   CONFIG_TOKEN
