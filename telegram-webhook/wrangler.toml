name = "marketplace-telegram-webhook"
main = "worker.js"
compatibility_date = "2024-11-01"

# Free plan: each cron expression ~once/hour max.
# Two triggers (:00 and :30) → ~every 30 minutes.
# Worker still respects Telegram poll_interval_minutes.
[triggers]
crons = ["0 * * * *", "30 * * * *"]

[[kv_namespaces]]
binding = "SETTINGS"
id = "5c38578fe2534736ae844cfb6bfc2453"

# Secrets:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_IDS
#   GITHUB_TOKEN
#   GITHUB_REPO
#   CONFIG_TOKEN
