name = "marketplace-telegram-webhook"
main = "worker.js"
compatibility_date = "2024-11-01"

# Free plan: each cron expression ~once/hour max.
# Two triggers (:00 and :30) ask the Worker whether a scan is due.
# Worker still respects Telegram poll_interval_minutes.
[triggers]
crons = ["0 * * * *", "30 * * * *"]

[[kv_namespaces]]
binding = "SETTINGS"
id = "38734faac2d74a8793c5c490c72f7446"

# Secrets:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_IDS
#   GITHUB_TOKEN
#   GITHUB_REPO
#   CONFIG_TOKEN
