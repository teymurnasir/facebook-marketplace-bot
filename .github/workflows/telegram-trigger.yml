# Backup only: poll Telegram for /scan (slow, up to ~5 min).
# Prefer the Cloudflare webhook in telegram-webhook/ for instant /scan.
# Keep this disabled while a Telegram webhook is active (getUpdates conflict).

name: Telegram /scan trigger

on:
  # schedule disabled — use telegram-webhook Worker for instant /scan
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-trigger
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install httpx python-dotenv

      - name: Restore Telegram offset
        uses: actions/cache/restore@v4
        with:
          path: data/telegram_offset.txt
          key: telegram-offset-${{ github.run_id }}
          restore-keys: |
            telegram-offset-

      - name: Check Telegram for /scan
        id: tg
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OFFSET_PATH: data/telegram_offset.txt
        run: python scripts/check_telegram_trigger.py

      - name: Save Telegram offset
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/telegram_offset.txt
          key: telegram-offset-${{ github.run_id }}

      - name: Start Marketplace scan
        if: steps.tg.outputs.should_scan == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'marketplace.yml',
              ref: 'main',
            });
            console.log('Dispatched marketplace.yml');
