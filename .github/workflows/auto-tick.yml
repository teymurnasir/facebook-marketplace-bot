# Manual debug only. Cloudflare Worker cron owns automatic due checks,
# so GitHub Actions minutes are spent only on real Marketplace scans.

name: Auto scan tick

on:
  workflow_dispatch:
    inputs:
      pause_scans:
        description: "Pause automatic dispatches for login or security recovery"
        type: boolean
        default: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Worker if a scan is due
        if: ${{ !inputs.pause_scans }}
        env:
          SETTINGS_CONFIG_URL: ${{ secrets.SETTINGS_CONFIG_URL }}
          SETTINGS_CONFIG_TOKEN: ${{ secrets.SETTINGS_CONFIG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SETTINGS_CONFIG_URL:-}" ] || [ -z "${SETTINGS_CONFIG_TOKEN:-}" ]; then
            echo "Missing SETTINGS_CONFIG_URL / SETTINGS_CONFIG_TOKEN"
            exit 1
          fi
          BASE="${SETTINGS_CONFIG_URL%/config}"
          echo "Pinging ${BASE}/tick at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${SETTINGS_CONFIG_TOKEN}" \
            "${BASE}/tick" | tee /tmp/tick.json
          echo
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/tick.json"))
          print("result:", d)
          if d.get("started"):
            print("Scan dispatched")
          elif d.get("skipped"):
            print("Skipped:", d.get("skipped"))
            if d.get("next_due_ms"):
              from datetime import datetime, timezone
              print("Next due UTC:", datetime.fromtimestamp(d["next_due_ms"]/1000, tz=timezone.utc).isoformat())
          PY
      - name: Pause automatic dispatches
        if: inputs.pause_scans
        env:
          SETTINGS_CONFIG_URL: ${{ secrets.SETTINGS_CONFIG_URL }}
          SETTINGS_CONFIG_TOKEN: ${{ secrets.SETTINGS_CONFIG_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['SETTINGS_CONFIG_URL'].removesuffix('/config').rstrip('/')
          data = json.dumps({'status': 'inactive', 'scan_started_at': int(time.time() * 1000)}).encode()
          request = urllib.request.Request(base + '/session', data=data, headers={
              'Authorization': 'Bearer ' + os.environ['SETTINGS_CONFIG_TOKEN'],
              'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if not result.get('ok') or not result.get('applied'):
              raise SystemExit('Could not confirm automatic scan pause')
          print('Automatic dispatches paused; saved interval and car database unchanged.')
          PY
