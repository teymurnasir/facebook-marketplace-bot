# Pings the Cloudflare Worker every 15 minutes.
# Worker decides whether a scan is due from Telegram poll_interval_minutes.
# (Cloudflare Free cron often only runs about once per hour.)

name: Auto scan tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Worker if a scan is due
        env:
          SETTINGS_CONFIG_URL: ${{ secrets.SETTINGS_CONFIG_URL }}
          SETTINGS_CONFIG_TOKEN: ${{ secrets.SETTINGS_CONFIG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SETTINGS_CONFIG_URL:-}" ] || [ -z "${SETTINGS_CONFIG_TOKEN:-}" ]; then
            echo "Missing SETTINGS_CONFIG_URL / SETTINGS_CONFIG_TOKEN"
            exit 1
          fi
          BASE="${SETTINGS_CONFIG_URL%/config}"
          echo "Pinging ${BASE}/tick"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${SETTINGS_CONFIG_TOKEN}" \
            "${BASE}/tick" | tee /tmp/tick.json
          echo
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/tick.json"))
          print("result:", d)
          if d.get("started"):
            print("Scan dispatched")
          elif d.get("skipped"):
            print("Skipped:", d.get("skipped"))
          PY
