name: Sync saved cars database

on:
  workflow_dispatch:
    inputs:
      refresh_details:
        description: "Read up to 30 saved car descriptions before syncing (no new search)"
        type: boolean
        default: false

concurrency:
  group: marketplace-scan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sync dependencies
        run: pip install httpx PyYAML cryptography
      - name: Install description reader
        if: inputs.refresh_details
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Identify Facebook session generation
        id: facebook-session
        if: inputs.refresh_details
        env:
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
          FACEBOOK_SESSION_CACHE_KEY: ${{ secrets.FACEBOOK_SESSION_CACHE_KEY }}
        run: python -m scripts.prepare_session generation >> "$GITHUB_OUTPUT"
      - name: Restore saved Facebook session
        if: inputs.refresh_details
        uses: actions/cache/restore@v4
        with:
          path: facebook_session.enc
          key: fb-session-v4-encrypted-${{ steps.facebook-session.outputs.generation }}-${{ github.run_id }}
          restore-keys: |
            fb-session-v4-encrypted-${{ steps.facebook-session.outputs.generation }}-
      - name: Restore session secret if no cached session
        if: inputs.refresh_details
        env:
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
          FACEBOOK_SESSION_CACHE_KEY: ${{ secrets.FACEBOOK_SESSION_CACHE_KEY }}
        run: python -m scripts.prepare_session restore
      - name: Restore existing scan database
        uses: actions/cache/restore@v4
        with:
          path: data/seen.db
          key: seen-db-v4-${{ github.run_id }}
          restore-keys: |
            seen-db-v4-
          fail-on-cache-miss: true
      - name: Publish saved findings for Telegram /cars
        id: sync
        env:
          SETTINGS_CONFIG_URL: ${{ secrets.SETTINGS_CONFIG_URL }}
          SETTINGS_CONFIG_TOKEN: ${{ secrets.SETTINGS_CONFIG_TOKEN }}
          REFRESH_CAR_DETAILS: ${{ inputs.refresh_details }}
        run: python -m scripts.sync_findings
      - name: Save enriched car database
        if: always() && inputs.refresh_details
        uses: actions/cache/save@v4
        with:
          path: data/seen.db
          key: seen-db-v4-${{ github.run_id }}
      - name: Save refreshed Facebook session
        if: success() && inputs.refresh_details && steps.sync.outputs.facebook_session_refreshed == 'true'
        env:
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
          FACEBOOK_SESSION_CACHE_KEY: ${{ secrets.FACEBOOK_SESSION_CACHE_KEY }}
        run: python -m scripts.prepare_session encrypt

      - name: Save encrypted Facebook session cache
        if: success() && inputs.refresh_details && steps.sync.outputs.facebook_session_refreshed == 'true'
        uses: actions/cache/save@v4
        with:
          path: facebook_session.enc
          key: fb-session-v4-encrypted-${{ steps.facebook-session.outputs.generation }}-${{ github.run_id }}
