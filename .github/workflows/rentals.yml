# Public MLS rental search through Royal LePage; independent of Facebook access.
# Uses the same repository secrets as the existing Marketplace workflow.
name: House rental scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

concurrency:
  group: rental-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Restore rental history
        uses: actions/cache/restore@v4
        with:
          path: data/rentals.db
          key: rentals-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rentals-db-v1-
      - name: Scan rental houses
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RENTAL_SCAN_SUMMARY: ${{ github.event_name == 'workflow_dispatch' }}
        run: python rental_main.py --once
      - name: Save rental history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/rentals.db
          key: rentals-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
