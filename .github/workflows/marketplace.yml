# Emergency / manual only. Normal scans run on the always-on local PC scanner
# (python main.py), not via GitHub Actions.
# Repo must be PRIVATE — it uses your Facebook session secret.

name: Marketplace scan

on:
  # Auto timing is controlled by telegram-webhook/worker.js and auto-tick.yml,
  # so Telegram /settings remains the source of truth for the interval.
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional Cloudflare job id for /customsearch (one-off)"
        required: false
        default: ""

concurrency:
  group: marketplace-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: [self-hosted, marketplace-bot]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      # Self-hosted Windows: use the machine Python (setup-python needs admin registry access).
      - name: Verify Python
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] >= (3, 11), sys.version"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Load live Telegram settings or custom job
        env:
          SETTINGS_CONFIG_URL: ${{ secrets.SETTINGS_CONFIG_URL }}
          SETTINGS_CONFIG_TOKEN: ${{ secrets.SETTINGS_CONFIG_TOKEN }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:JOB_ID -and $env:SETTINGS_CONFIG_URL -and $env:SETTINGS_CONFIG_TOKEN) {
            $base = $env:SETTINGS_CONFIG_URL -replace '/config$', ''
            Invoke-WebRequest -UseBasicParsing -Uri "$base/job/$($env:JOB_ID)" -Headers @{ Authorization = "Bearer $($env:SETTINGS_CONFIG_TOKEN)" } -OutFile "$env:RUNNER_TEMP\live-config.json"
            "CUSTOM_SEARCH=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Loaded custom job $($env:JOB_ID)"
          } elseif ($env:SETTINGS_CONFIG_URL -and $env:SETTINGS_CONFIG_TOKEN) {
            Invoke-WebRequest -UseBasicParsing -Uri $env:SETTINGS_CONFIG_URL -Headers @{ Authorization = "Bearer $($env:SETTINGS_CONFIG_TOKEN)" } -OutFile "$env:RUNNER_TEMP\live-config.json"
            Write-Host "Loaded shared /settings config"
          } else {
            Write-Host "No live settings secrets - using repo config.yaml"
            exit 0
          }
          python scripts/json_config_to_yaml.py "$env:RUNNER_TEMP\live-config.json" config.yaml
          Write-Host "config.yaml head:"
          Get-Content config.yaml -TotalCount 80

      - name: Restore refreshed Facebook session cache
        uses: actions/cache/restore@v4
        with:
          path: storage_state.json
          key: fb-session-v2-${{ github.run_id }}
          restore-keys: |
            fb-session-v2-

      - name: Restore Facebook session
        env:
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((Test-Path storage_state.json) -and ((Get-Item storage_state.json).Length -gt 0)) {
            Write-Host "Using cached refreshed Facebook session"
          } else {
            if (-not $env:FACEBOOK_STORAGE_STATE_B64) {
              Write-Error "Missing secret FACEBOOK_STORAGE_STATE_B64"
              exit 1
            }
            [IO.File]::WriteAllBytes((Join-Path $pwd "storage_state.json"), [Convert]::FromBase64String($env:FACEBOOK_STORAGE_STATE_B64))
            Write-Host "Restored Facebook session from secret"
          }
          python -c "import json; d=json.load(open('storage_state.json')); assert any(c['name']=='c_user' for c in d.get('cookies',[]))"

      - name: Restore seen.db
        uses: actions/cache/restore@v4
        with:
          path: data/seen.db
          key: seen-db-v3-${{ github.run_id }}
          restore-keys: |
            seen-db-v3-

      - name: Ensure / seed seen.db
        env:
          SEEN_DB_B64: ${{ secrets.SEEN_DB_B64 }}
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          if (-not (Test-Path data/seen.db) -and $env:SEEN_DB_B64) {
            [IO.File]::WriteAllBytes((Join-Path $pwd "data\seen.db"), [Convert]::FromBase64String($env:SEEN_DB_B64))
            Write-Host "Seeded seen.db from secret"
          }
          Get-ChildItem data -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: Run one Marketplace scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
          FACEBOOK_STORAGE_STATE: storage_state.json
          CUSTOM_SEARCH: ${{ env.CUSTOM_SEARCH }}
        run: python main.py --once

      - name: Save seen.db for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen.db
          key: seen-db-v3-${{ github.run_id }}

      - name: Save refreshed Facebook session for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: storage_state.json
          key: fb-session-v2-${{ github.run_id }}
