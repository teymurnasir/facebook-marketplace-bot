# Runs in GitHub Actions cloud when Telegram /scan or the auto tick dispatches it.
# Repo must be PRIVATE — it uses your Facebook session secret.

name: Marketplace scan

on:
  # Auto timing is controlled by telegram-webhook/worker.js and auto-tick.yml,
  # so Telegram /settings remains the source of truth for the interval.
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional Cloudflare job id for /customsearch (one-off)"
        required: false
        default: ""

concurrency:
  group: marketplace-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Load live Telegram settings or custom job
        env:
          SETTINGS_CONFIG_URL: ${{ secrets.SETTINGS_CONFIG_URL }}
          SETTINGS_CONFIG_TOKEN: ${{ secrets.SETTINGS_CONFIG_TOKEN }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          set -euo pipefail
          if [ -n "${JOB_ID:-}" ] && [ -n "${SETTINGS_CONFIG_URL:-}" ] && [ -n "${SETTINGS_CONFIG_TOKEN:-}" ]; then
            BASE="${SETTINGS_CONFIG_URL%/config}"
            curl -fsS \
              -H "Authorization: Bearer ${SETTINGS_CONFIG_TOKEN}" \
              "${BASE}/job/${JOB_ID}" \
              -o /tmp/live-config.json
            echo "CUSTOM_SEARCH=1" >> "$GITHUB_ENV"
            echo "Loaded custom job ${JOB_ID}"
          elif [ -n "${SETTINGS_CONFIG_URL:-}" ] && [ -n "${SETTINGS_CONFIG_TOKEN:-}" ]; then
            curl -fsS \
              -H "Authorization: Bearer ${SETTINGS_CONFIG_TOKEN}" \
              "$SETTINGS_CONFIG_URL" \
              -o /tmp/live-config.json
            echo "Loaded shared /settings config"
          else
            echo "No live settings secrets - using repo config.yaml"
            exit 0
          fi
          python scripts/json_config_to_yaml.py /tmp/live-config.json config.yaml
          echo "---- config.yaml (head) ----"
          head -n 80 config.yaml

      - name: Identify Facebook session generation
        id: facebook-session
        env:
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
        run: python -m scripts.prepare_session generation >> "$GITHUB_OUTPUT"

      - name: Restore refreshed Facebook session cache
        uses: actions/cache/restore@v4
        with:
          path: storage_state.json
          key: fb-session-v3-${{ steps.facebook-session.outputs.generation }}-${{ github.run_id }}
          restore-keys: |
            fb-session-v3-${{ steps.facebook-session.outputs.generation }}-

      - name: Restore Facebook session
        env:
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
        run: python -m scripts.prepare_session restore

      - name: Restore seen.db
        uses: actions/cache/restore@v4
        with:
          path: data/seen.db
          key: seen-db-v4-${{ github.run_id }}
          restore-keys: |
            seen-db-v4-

      - name: Ensure / seed seen.db
        env:
          SEEN_DB_B64: ${{ secrets.SEEN_DB_B64 }}
        run: |
          mkdir -p data
          if [ ! -f data/seen.db ] && [ -n "$SEEN_DB_B64" ]; then
            echo "$SEEN_DB_B64" | base64 --decode > data/seen.db
            echo "Seeded seen.db from secret"
          fi
          ls -la data || true

      - name: Run one Marketplace scan
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
          FACEBOOK_STORAGE_STATE: storage_state.json
          CUSTOM_SEARCH: ${{ env.CUSTOM_SEARCH }}
          SETTINGS_CONFIG_URL: ${{ secrets.SETTINGS_CONFIG_URL }}
          SETTINGS_CONFIG_TOKEN: ${{ secrets.SETTINGS_CONFIG_TOKEN }}
        run: python main.py --once

      - name: Save seen.db for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen.db
          key: seen-db-v4-${{ github.run_id }}

      - name: Save refreshed Facebook session for next run
        if: success() && steps.scan.outputs.facebook_session_refreshed == 'true'
        uses: actions/cache/save@v4
        with:
          path: storage_state.json
          key: fb-session-v3-${{ steps.facebook-session.outputs.generation }}-${{ github.run_id }}
