# Runs every 30 minutes in the cloud (no laptop needed).
# Repo must be PRIVATE — it uses your Facebook session secret.

name: Marketplace scan

on:
  schedule:
    # Every 30 minutes (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: marketplace-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Load live Telegram settings
        env:
          SETTINGS_CONFIG_URL: ${{ secrets.SETTINGS_CONFIG_URL }}
          SETTINGS_CONFIG_TOKEN: ${{ secrets.SETTINGS_CONFIG_TOKEN }}
        run: |
          if [ -n "$SETTINGS_CONFIG_URL" ] && [ -n "$SETTINGS_CONFIG_TOKEN" ]; then
            curl -fsS \
              -H "Authorization: Bearer ${SETTINGS_CONFIG_TOKEN}" \
              "$SETTINGS_CONFIG_URL" \
              -o /tmp/live-config.json
            python scripts/json_config_to_yaml.py /tmp/live-config.json config.yaml
            echo "---- live config.yaml (head) ----"
            head -n 60 config.yaml
          else
            echo "No live settings secrets — using repo config.yaml"
          fi

      - name: Restore Facebook session
        env:
          FACEBOOK_STORAGE_STATE_B64: ${{ secrets.FACEBOOK_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$FACEBOOK_STORAGE_STATE_B64" ]; then
            echo "Missing secret FACEBOOK_STORAGE_STATE_B64"
            exit 1
          fi
          echo "$FACEBOOK_STORAGE_STATE_B64" | base64 --decode > storage_state.json
          python -c "import json; d=json.load(open('storage_state.json')); assert any(c['name']=='c_user' for c in d.get('cookies',[]))"

      - name: Restore seen.db
        uses: actions/cache/restore@v4
        with:
          path: data/seen.db
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-

      - name: Ensure / seed seen.db
        env:
          SEEN_DB_B64: ${{ secrets.SEEN_DB_B64 }}
        run: |
          mkdir -p data
          if [ ! -f data/seen.db ] && [ -n "$SEEN_DB_B64" ]; then
            echo "$SEEN_DB_B64" | base64 --decode > data/seen.db
            echo "Seeded seen.db from secret"
          fi
          ls -la data || true

      - name: Run one Marketplace scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
          FACEBOOK_STORAGE_STATE: storage_state.json
        run: python main.py --once

      - name: Save seen.db for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen.db
          key: seen-db-${{ github.run_id }}
